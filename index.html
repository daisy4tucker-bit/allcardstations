<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AllCardStation - Digital Gift Card Marketplace & Card Validation</title>
    <meta name="description" content="Buy, redeem, and validate digital gift cards with instant email delivery and live balance checking across eBay, Apple, Amazon, Steam, Visa, and top global brands." />
    
    <!-- Google Search Console Verification Meta Tag -->
    <meta name="google-site-verification" content="GSC_ALLCARDSTATION_VERIFICATION_KEY" />
    
    <!-- Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    
    <!-- Open Graph / Social Sharing Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://allcardstation.com/" />
    <meta property="og:title" content="AllCardStation - Digital Gift Card Marketplace & Instant Card Validation" />
    <meta property="og:description" content="Instant digital gift card delivery, 256-bit SSL encrypted validation, and 24/7 customer support for top global gift card brands." />
    <meta property="og:image" content="/favicon.svg" />
    <meta property="og:site_name" content="AllCardStation" />
    
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AllCardStation - Digital Gift Card Marketplace" />
    <meta name="twitter:description" content="Discover, buy, and validate digital gift cards with instant delivery and zero hassle." />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://allcardstation.com/" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Structured Data (JSON-LD) for Search Console & SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://allcardstation.com/#organization",
            "name": "AllCardStation",
            "url": "https://allcardstation.com",
            "logo": "https://allcardstation.com/logo.svg",
            "sameAs": [
              "https://twitter.com/allcardstation",
              "https://facebook.com/allcardstation"
            ],
            "contactPoint": {
              "@type": "ContactPoint",
              "contactType": "customer support",
              "email": "support@allcardstation.com",
              "availableLanguage": ["English"]
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://allcardstation.com/#website",
            "url": "https://allcardstation.com",
            "name": "AllCardStation",
            "publisher": {
              "@id": "https://allcardstation.com/#organization"
            },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://allcardstation.com/gift-cards?search={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 font-sans antialiased selection:bg-indigo-600 selection:text-white min-h-screen flex flex-col">
    <div id="root" class="flex-1 flex flex-col"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
