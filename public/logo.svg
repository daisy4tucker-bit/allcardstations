<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="100%" height="100%">
  <defs>
    <linearGradient id="yellowCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="tealCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="blueCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="swooshGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="40%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>

  <!-- Shopping Bag Handle Outline -->
  <path d="M 235 45 C 235 22 255 10 300 10 C 345 10 365 22 365 45 L 375 60 L 225 60 Z" fill="none" stroke="#1e3a8a" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
  <path d="M 215 55 L 385 55 L 395 100 L 205 100 Z" fill="none" stroke="#1e3a8a" stroke-width="6" stroke-linejoin="round" opacity="0.85" />

  <!-- Back Card: Orange/Yellow with Shopping Cart -->
  <g transform="translate(155, 68) rotate(-12)">
    <rect x="0" y="0" width="110" height="72" rx="10" fill="url(#yellowCard)" stroke="#ffffff" stroke-width="2.5" />
    <!-- Cart Icon -->
    <path d="M 35 28 L 45 28 L 52 45 L 75 45 L 82 32 L 48 32" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="56" cy="52" r="4" fill="#ffffff" />
    <circle cx="74" cy="52" r="4" fill="#ffffff" />
  </g>

  <!-- Middle Card: Teal with Gamepads -->
  <g transform="translate(210, 58) rotate(-2)">
    <rect x="0" y="0" width="120" height="78" rx="10" fill="url(#tealCard)" stroke="#ffffff" stroke-width="2.5" />
    <!-- Gamepad icons representation -->
    <rect x="35" y="26" width="22" height="14" rx="4" fill="#ffffff" opacity="0.9" />
    <circle cx="72" cy="33" r="5" fill="#ffffff" opacity="0.9" />
    <circle cx="88" cy="33" r="5" fill="#ffffff" opacity="0.9" />
    <rect x="65" y="48" width="30" height="12" rx="4" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Front Card: Dark Blue with Gift Box Ribbon -->
  <g transform="translate(265, 72) rotate(8)">
    <rect x="0" y="0" width="135" height="85" rx="10" fill="url(#blueCard)" stroke="#ffffff" stroke-width="3" />
    <!-- Gift Box Ribbon -->
    <rect x="58" y="15" width="18" height="60" fill="#ffffff" opacity="0.95" />
    <rect x="15" y="40" width="105" height="16" fill="#ffffff" opacity="0.95" />
    <!-- Bow -->
    <path d="M 67 15 C 55 5 45 20 60 25 C 65 26 67 15 67 15 Z" fill="#ffffff" />
    <path d="M 67 15 C 79 5 89 20 74 25 C 69 26 67 15 67 15 Z" fill="#ffffff" />
    <!-- Text on card -->
    <text x="95" y="38" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#ffffff" letter-spacing="1">GIFT</text>
    <text x="95" y="55" font-family="system-ui, sans-serif" font-weight="900" font-size="13" fill="#ffffff" letter-spacing="1">CARD</text>
  </g>

  <!-- Bottom Curved Swoosh -->
  <path d="M 155 155 C 220 185 380 185 445 155" fill="none" stroke="url(#swooshGrad)" stroke-width="9" stroke-linecap="round" />
</svg>
