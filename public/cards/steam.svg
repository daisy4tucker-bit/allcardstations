<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Dark Charcoal / Steam Navy Background matching screenshot -->
  <rect width="800" height="500" rx="32" fill="#1B2838" />

  <!-- Steam Crank Icon + STEAM Typography in Solid White -->
  <g transform="translate(400, 255)">
    <!-- Steam Crank / Piston Arm in White -->
    <g transform="translate(-180, 0) scale(1.35)">
      <circle cx="0" cy="0" r="54" fill="none" stroke="#FFFFFF" stroke-width="12" />
      <circle cx="-16" cy="20" r="18" fill="none" stroke="#FFFFFF" stroke-width="9" />
      <line x1="0" y1="0" x2="-16" y2="20" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" />
    </g>
    <!-- STEAM Typography -->
    <text x="35" y="32" font-family="'Motiva Sans', 'Segoe UI', Impact, Arial, sans-serif" font-size="106" font-weight="900" fill="#FFFFFF" letter-spacing="4">STEAM<tspan font-size="24" dy="-54">®</tspan></text>
  </g>
</svg>
