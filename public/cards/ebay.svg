<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Card Background White with rounded corners -->
  <rect width="800" height="500" rx="32" fill="#FFFFFF" />
  <rect width="796" height="496" x="2" y="2" rx="30" fill="none" stroke="#E2E8F0" stroke-width="2" />

  <!-- Top Peg Cutout Notch & USA Flag Badge -->
  <g transform="translate(400, 45)">
    <!-- Peg Slot outline -->
    <path d="M-50,-20 C-50,-28 -40,-35 -20,-35 L-20,-45 C-20,-50 -10,-55 0,-55 C10,-55 20,-50 20,-45 L20,-35 C40,-35 50,-28 50,-20 C50,-10 40,0 30,0 L-30,0 C-40,0 -50,-10 -50,-20 Z" fill="none" stroke="#CBD5E1" stroke-width="2" />
  </g>

  <!-- US Flag Top Right -->
  <g transform="translate(710, 50) scale(0.65)">
    <!-- Flag Stripes -->
    <rect x="-40" y="-25" width="80" height="50" fill="#B22234" rx="2" />
    <rect x="-40" y="-21" width="80" height="4" fill="#FFFFFF" />
    <rect x="-40" y="-13" width="80" height="4" fill="#FFFFFF" />
    <rect x="-40" y="-5" width="80" height="4" fill="#FFFFFF" />
    <rect x="-40" y="3" width="80" height="4" fill="#FFFFFF" />
    <rect x="-40" y="11" width="80" height="4" fill="#FFFFFF" />
    <rect x="-40" y="19" width="80" height="4" fill="#FFFFFF" />
    <!-- Blue Canton -->
    <rect x="-40" y="-25" width="36" height="26" fill="#3C3B6E" />
    <!-- Stars dots -->
    <circle cx="-34" cy="-20" r="1.5" fill="#FFFFFF" />
    <circle cx="-28" cy="-20" r="1.5" fill="#FFFFFF" />
    <circle cx="-22" cy="-20" r="1.5" fill="#FFFFFF" />
    <circle cx="-16" cy="-20" r="1.5" fill="#FFFFFF" />
    <circle cx="-10" cy="-20" r="1.5" fill="#FFFFFF" />
    <circle cx="-31" cy="-15" r="1.5" fill="#FFFFFF" />
    <circle cx="-25" cy="-15" r="1.5" fill="#FFFFFF" />
    <circle cx="-19" cy="-15" r="1.5" fill="#FFFFFF" />
    <circle cx="-13" cy="-15" r="1.5" fill="#FFFFFF" />
    <circle cx="-34" cy="-10" r="1.5" fill="#FFFFFF" />
    <circle cx="-28" cy="-10" r="1.5" fill="#FFFFFF" />
    <circle cx="-22" cy="-10" r="1.5" fill="#FFFFFF" />
    <circle cx="-16" cy="-10" r="1.5" fill="#FFFFFF" />
    <circle cx="-10" cy="-10" r="1.5" fill="#FFFFFF" />
    <circle cx="-31" cy="-5" r="1.5" fill="#FFFFFF" />
    <circle cx="-25" cy="-5" r="1.5" fill="#FFFFFF" />
    <circle cx="-19" cy="-5" r="1.5" fill="#FFFFFF" />
    <circle cx="-13" cy="-5" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Multi-color eBay wordmark centered -->
  <g transform="translate(400, 290) scale(2.4)">
    <text x="0" y="0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="105" font-weight="bold" text-anchor="middle" letter-spacing="-6">
      <tspan fill="#E53238">e</tspan><tspan fill="#0064D2">b</tspan><tspan fill="#F5AF02">a</tspan><tspan fill="#86B817">y</tspan>
    </text>
  </g>
</svg>
