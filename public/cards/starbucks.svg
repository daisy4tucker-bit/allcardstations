<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Card Deep Starbucks Forest Green -->
  <rect width="800" height="500" rx="32" fill="#004732" />

  <!-- Left Starbucks Siren Face & Hair Silhouette in White -->
  <g transform="translate(0, 0)">
    <!-- Face Contour & Crown -->
    <path d="M 0,140 C 40,140 100,160 140,220 C 180,280 180,340 140,400 C 100,450 40,500 0,500 Z" fill="#004732" />

    <!-- White Hair Waves & Face Graphics -->
    <!-- Siren Face Base -->
    <path d="M 0,140 C 60,140 130,170 170,240 C 195,290 190,360 140,420 C 80,480 0,500 0,500 L 0,140 Z" fill="#FFFFFF" />

    <!-- Negative Space Cutouts for Eyes, Nose, Lips, Hair Straps in Green -->
    <!-- Eyes -->
    <path d="M 0,210 C 35,210 50,185 70,180 C 50,195 30,225 0,225 Z" fill="#004732" />
    <path d="M 90,180 C 110,185 130,210 160,210 C 135,225 110,195 90,180 Z" fill="#004732" />
    <!-- Pupils -->
    <ellipse cx="45" cy="202" rx="14" ry="16" fill="#004732" />
    <ellipse cx="115" cy="202" rx="14" ry="16" fill="#004732" />

    <!-- Nose -->
    <path d="M 76,230 L 84,230 L 88,255 L 72,255 Z" fill="#004732" />
    <path d="M 72,252 C 76,260 84,260 88,252 Z" fill="#004732" />

    <!-- Smile Lips -->
    <path d="M 50,275 C 70,295 90,295 110,275 C 90,305 70,305 50,275 Z" fill="#004732" />

    <!-- Chin Cutout -->
    <path d="M 0,310 C 50,335 110,335 150,310 C 160,370 110,430 0,440 Z" fill="#004732" />

    <!-- Hair Wave Bands sweeping right -->
    <path d="M 170,140 C 230,180 270,250 290,340 C 305,410 290,470 260,500 C 290,470 310,400 295,330 C 275,240 230,170 170,140 Z" fill="#FFFFFF" />
    <path d="M 215,140 C 280,190 330,270 355,360 C 375,430 360,480 330,500 C 365,480 380,420 360,350 C 335,260 280,180 215,140 Z" fill="#FFFFFF" />
    <path d="M 270,150 C 340,210 395,290 420,380 C 440,440 430,485 410,500 C 435,485 448,435 425,370 C 400,280 340,200 270,150 Z" fill="#FFFFFF" />
    <path d="M 330,170 C 400,230 455,310 475,395 C 490,450 480,485 465,500 C 485,485 495,440 480,385 C 458,300 400,220 330,170 Z" fill="#FFFFFF" />
  </g>

  <!-- Top Right Starbucks Circular Emblem -->
  <g transform="translate(680, 85) scale(0.65)">
    <circle cx="0" cy="0" r="64" fill="#004732" stroke="#FFFFFF" stroke-width="4" />
    <!-- Mini Siren & Crown in white -->
    <circle cx="0" cy="0" r="54" fill="none" stroke="#FFFFFF" stroke-width="2.5" />
    <!-- Crown -->
    <polygon points="-24,-20 0,-42 24,-20 12,-16 0,-24 -12,-16" fill="#FFFFFF" />
    <polygon points="0,-48 -6,-36 6,-36" fill="#FFFFFF" />
    <!-- Face -->
    <ellipse cx="0" cy="-6" rx="16" ry="18" fill="#FFFFFF" />
    <ellipse cx="0" cy="-4" rx="12" ry="14" fill="#004732" />
    <!-- Hair Waves inside badge -->
    <path d="M-40,10 C-30,30 -15,40 0,40 C15,40 30,30 40,10 C35,25 20,44 0,44 C-20,44 -35,25 -40,10 Z" fill="#FFFFFF" />
    <circle cx="-32" cy="-6" r="3" fill="#FFFFFF" />
    <circle cx="32" cy="-6" r="3" fill="#FFFFFF" />
  </g>
</svg>
