<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Royal Blue Card Background matching uploaded screenshot -->
  <rect width="800" height="500" rx="32" fill="#0C41C4" />
  
  <!-- Subtle decorative sheen -->
  <path d="M0,0 L800,0 L800,160 L0,320 Z" fill="#FFFFFF" fill-opacity="0.04" />
  
  <!-- Centered Bold White VISA Wordmark in exact italic angle -->
  <g transform="translate(400, 275) scale(2.6)">
    <text x="0" y="0" font-family="'Helvetica Neue', 'Arial Black', Arial, sans-serif" font-style="italic" font-weight="900" font-size="78" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
      VISA
    </text>
  </g>
</svg>
