<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="tgtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8f9fa" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>
  <!-- Card Background -->
  <rect width="800" height="500" rx="32" fill="url(#tgtBg)" />
  <rect width="796" height="496" x="2" y="2" rx="30" fill="none" stroke="#e5e7eb" stroke-width="2" />
  
  <!-- Subtle decorative circles -->
  <circle cx="750" cy="50" r="180" fill="#cc0000" fill-opacity="0.03" />
  <circle cx="50" cy="450" r="140" fill="#cc0000" fill-opacity="0.02" />

  <!-- Target Logo Bullseye -->
  <g transform="translate(400, 210)" filter="url(#shadow)">
    <!-- Outer red ring -->
    <circle cx="0" cy="0" r="96" fill="#CC0000" />
    <!-- Middle white ring -->
    <circle cx="0" cy="0" r="64" fill="#FFFFFF" />
    <!-- Inner red center -->
    <circle cx="0" cy="0" r="32" fill="#CC0000" />
  </g>

  <!-- Target Typography -->
  <text x="400" y="375" font-family="Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="#CC0000" text-anchor="middle" letter-spacing="-1.5">target</text>

  <!-- Card Value / Tag -->
  <text x="750" y="70" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="800" fill="#6B7280" text-anchor="end" letter-spacing="2">GIFT CARD</text>
</svg>
