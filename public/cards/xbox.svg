<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="100%" height="100%">
  <!-- Solid Xbox Green Background -->
  <rect width="1000" height="625" fill="#107C10"/>
  
  <g transform="translate(220, 312.5)">
    <!-- Xbox Sphere Logo -->
    <g transform="translate(-50, 0)">
      <!-- Outer white circle border -->
      <circle cx="0" cy="0" r="110" fill="none" stroke="#FFFFFF" stroke-width="12"/>
      
      <!-- White filled sphere base -->
      <circle cx="0" cy="0" r="104" fill="#FFFFFF"/>
      
      <!-- Green cutouts / sweeping intersecting paths for the X / sphere effect -->
      <path d="M -74 -55 C -30 -15 30 -15 74 -55 C 50 5 -50 5 -74 -55 Z" fill="#107C10"/>
      <path d="M -74 55 C -30 15 30 15 74 55 C 50 -5 -50 -5 -74 55 Z" fill="#107C10"/>
      <path d="M 0 -104 C -20 -40 -20 40 0 104 C 20 40 20 -40 0 -104 Z" fill="#107C10" transform="rotate(0)"/>
    </g>

    <!-- XBOX Text -->
    <text x="140" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="160" font-weight="900" fill="#FFFFFF" letter-spacing="12">XBOX</text>
  </g>
</svg>
