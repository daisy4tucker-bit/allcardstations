<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGlitter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C769" />
      <stop offset="30%" stop-color="#D4B04C" />
      <stop offset="60%" stop-color="#F2DE8A" />
      <stop offset="100%" stop-color="#C29B38" />
    </linearGradient>
    <filter id="emboss">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#553D0A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Gold Glitter Background -->
  <rect width="800" height="500" rx="32" fill="url(#goldGlitter)" />
  <rect width="796" height="496" x="2" y="2" rx="30" fill="none" stroke="#FDE68A" stroke-width="2" stroke-opacity="0.6" />

  <!-- Top Left: Vanilla. and VanillaGift.com -->
  <g transform="translate(65, 75)">
    <path d="M12,-18 L18,-24 L24,-18" fill="none" stroke="#1A1814" stroke-width="3.5" stroke-linecap="round" />
    <text x="0" y="0" font-family="'Century Gothic', 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="bold" fill="#1A1814" letter-spacing="-1">Vanilla<tspan font-size="46">.</tspan></text>
    <text x="3" y="26" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#2E2611" letter-spacing="0.5">VanillaGift.com</text>
  </g>

  <!-- Top Right: $50 GIFT CARD -->
  <g transform="translate(735, 75)" text-anchor="end">
    <text x="0" y="0" font-family="Impact, 'Arial Black', sans-serif" font-size="46" font-weight="bold" fill="#1A1814" letter-spacing="1">$ 5 0</text>
    <text x="0" y="24" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2E2611" letter-spacing="2">GIFT CARD</text>
  </g>

  <!-- Stylized Gift Box Ribbon & Cursive "gift" in center -->
  <g transform="translate(430, 260)">
    <path d="M-80,-140 C-140,-220 -40,-240 0,-140 C40,-240 140,-220 80,-140 Z" fill="none" stroke="#C49B28" stroke-width="12" stroke-linecap="round" />
    <path d="M-50,-150 C-100,-200 -20,-220 0,-150 C20,-220 100,-200 50,-150 Z" fill="#ECCB6A" opacity="0.6" />
    <path d="M-120,-120 L120,-120 L100,100 L-100,100 Z" fill="#D9B44A" opacity="0.75" />
    <text x="-40" y="60" font-family="'Brush Script MT', 'Segoe Script', 'Dancing Script', cursive" font-size="180" font-weight="normal" fill="#FFFFFF" text-anchor="middle" filter="url(#emboss)">
      gift
    </text>
  </g>

  <!-- Embossed Card Number 4097 5831 9185 6385 -->
  <g transform="translate(65, 340)">
    <text x="0" y="0" font-family="'Courier New', Courier, monospace" font-size="36" font-weight="bold" fill="#1A1814" letter-spacing="5" filter="url(#emboss)">
      4097 5831 9185 6385
    </text>
  </g>

  <!-- Expiration & Subtext -->
  <g transform="translate(65, 385)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#3D300F" letter-spacing="1">CARD EXPIRES</text>
    <text x="105" y="2" font-family="'Courier New', monospace" font-size="24" font-weight="bold" fill="#1A1814">10/33</text>
  </g>

  <!-- "A GIFT FOR YOU" -->
  <g transform="translate(65, 428)">
    <text x="0" y="0" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1A1814" letter-spacing="4">
      A GIFT FOR YOU
    </text>
    <text x="130" y="32" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2E2611" letter-spacing="1">
      VALID ONLY IN THE UNITED STATES
    </text>
  </g>

  <!-- DEBIT VISA Bottom Right -->
  <g transform="translate(735, 435)" text-anchor="end">
    <text x="0" y="-36" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="900" fill="#1A1814" letter-spacing="1">DEBIT</text>
    <g transform="translate(0, 0) scale(1.15)">
      <text x="0" y="0" font-family="'Helvetica Neue', Arial, sans-serif" font-style="italic" font-size="44" font-weight="900" fill="#0A3A82" letter-spacing="2">VISA</text>
    </g>
  </g>
</svg>
