<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="googlePlayBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#googlePlayBg)"/>
  
  <g transform="translate(400, 230)">
    <!-- Google Play Triangle Logo -->
    <g transform="translate(0, -40) scale(1.4)">
      <polygon points="-30,-45 15,0 -30,45" fill="#00ACC1"/>
      <polygon points="-30,-45 15,0 -15,15" fill="#4CAF50"/>
      <polygon points="-30,45 15,0 -15,-15" fill="#FFC107"/>
      <polygon points="15,0 35,15 15,30" fill="#F44336"/>
    </g>
    <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" fill="#334155" text-anchor="middle" letter-spacing="1">Google Play</text>
    <text x="0" y="145" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="2">GIFT CARD</text>
  </g>
</svg>
