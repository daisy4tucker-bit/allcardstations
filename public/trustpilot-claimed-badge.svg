<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" fill="none">
  <!-- Card Background -->
  <rect width="800" height="420" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Trustpilot Mini Star & Header -->
  <g transform="translate(32, 28)">
    <!-- Claimed Profile Pill -->
    <rect x="0" y="0" width="136" height="28" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
    <circle cx="14" cy="14" r="6" fill="#16A34A"/>
    <path d="M11.5 14L13 15.5L16.5 12" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#15803D">Claimed profile</text>

    <!-- Company Name -->
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="800" fill="#0F172A">Allcardstatus</text>
    
    <!-- Reviews Count & Rating -->
    <text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#2563EB" text-decoration="underline">Reviews 14</text>
    <circle cx="95" cy="99" r="2.5" fill="#94A3B8"/>
    
    <!-- 4 Stars Gold/Green Rating -->
    <g transform="translate(108, 86)">
      <!-- Star 1 -->
      <rect x="0" y="0" width="18" height="18" rx="3" fill="#00B67A"/>
      <path d="M9 3L10.8 6.6L14.7 7.2L11.9 9.9L12.5 13.8L9 12L5.5 13.8L6.1 9.9L3.3 7.2L7.2 6.6L9 3Z" fill="#FFFFFF"/>
      <!-- Star 2 -->
      <rect x="22" y="0" width="18" height="18" rx="3" fill="#00B67A"/>
      <path d="M31 3L32.8 6.6L36.7 7.2L33.9 9.9L34.5 13.8L31 12L27.5 13.8L28.1 9.9L25.3 7.2L29.2 6.6L31 3Z" fill="#FFFFFF"/>
      <!-- Star 3 -->
      <rect x="44" y="0" width="18" height="18" rx="3" fill="#00B67A"/>
      <path d="M53 3L54.8 6.6L58.7 7.2L55.9 9.9L56.5 13.8L53 12L49.5 13.8L50.1 9.9L47.3 7.2L51.2 6.6L53 3Z" fill="#FFFFFF"/>
      <!-- Star 4 -->
      <rect x="66" y="0" width="18" height="18" rx="3" fill="#00B67A"/>
      <path d="M75 3L76.8 6.6L80.7 7.2L77.9 9.9L78.5 13.8L75 12L71.5 13.8L72.1 9.9L69.3 7.2L73.2 6.6L75 3Z" fill="#FFFFFF"/>
      <!-- Star 5 (half/gray) -->
      <rect x="88" y="0" width="18" height="18" rx="3" fill="#E2E8F0"/>
      <path d="M97 3L98.8 6.6L102.7 7.2L99.9 9.9L100.5 13.8L97 12L93.5 13.8L94.1 9.9L91.3 7.2L95.2 6.6L97 3Z" fill="#94A3B8"/>
      
      <text x="116" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" fill="#0F172A">3.7</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(0, 130)">
      <!-- Write Review Button -->
      <rect x="0" y="0" width="140" height="38" rx="19" fill="#3B82F6"/>
      <text x="70" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Write a review</text>
      
      <!-- Visit Website Button -->
      <rect x="150" y="0" width="130" height="38" rx="19" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
      <text x="215" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#1E293B" text-anchor="middle">Visit website</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="32" y1="230" x2="768" y2="230" stroke="#F1F5F9" stroke-width="1.5"/>

  <!-- Trust Shield Banner -->
  <g transform="translate(32, 245)">
    <rect width="736" height="52" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Trust Shield Icon -->
    <rect x="16" y="11" width="30" height="30" rx="8" fill="#3B82F6"/>
    <path d="M31 18L33 23L38 23.8L34.3 27.5L35.2 32.5L31 30.1L26.8 32.5L27.7 27.5L24 23.8L29 23L31 18Z" fill="#FFFFFF"/>
    
    <text x="58" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#334155">
      We use technology to protect platform integrity, but we don't fact-check reviews
    </text>
  </g>

  <!-- Contact Info -->
  <g transform="translate(32, 320)">
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#0F172A">Contact info</text>
    
    <!-- Location Pin -->
    <g transform="translate(180, 8)">
      <path d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22C12 22 19 14.25 19 9C19 5.13 15.87 2 12 2ZM12 11.5C10.62 11.5 9.5 10.38 9.5 9C9.5 7.62 10.62 6.5 12 6.5C13.38 6.5 14.5 7.62 14.5 9C14.5 10.38 13.38 11.5 12 11.5Z" fill="#64748B"/>
      <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#334155">United States</text>
    </g>

    <!-- Web Globe -->
    <g transform="translate(180, 42)">
      <circle cx="12" cy="12" r="9" stroke="#64748B" stroke-width="1.5"/>
      <path d="M3 12H21M12 3C14.5 6.5 15.5 12 15.5 12C15.5 12 14.5 17.5 12 21C9.5 17.5 8.5 12 8.5 12C8.5 12 9.5 6.5 12 3Z" stroke="#64748B" stroke-width="1.5"/>
      <text x="24" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#2563EB">allcardstatus.com</text>
    </g>
  </g>
</svg>
