<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="favAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="favTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- Background container with rounded corners -->
  <rect width="64" height="64" rx="14" fill="#0f172a" />

  <!-- Back Card: Amber -->
  <g transform="translate(10, 16) rotate(-10)">
    <rect x="0" y="0" width="30" height="20" rx="3.5" fill="url(#favAmber)" stroke="#ffffff" stroke-width="1" opacity="0.9" />
  </g>

  <!-- Middle Card: Teal -->
  <g transform="translate(18, 14) rotate(-2)">
    <rect x="0" y="0" width="32" height="22" rx="3.5" fill="url(#favTeal)" stroke="#ffffff" stroke-width="1" opacity="0.95" />
  </g>

  <!-- Front Card: Indigo -->
  <g transform="translate(24, 18) rotate(8)">
    <rect x="0" y="0" width="34" height="24" rx="4" fill="url(#favBlue)" stroke="#ffffff" stroke-width="1.2" />
    <!-- Chip / Ribbon on front card -->
    <rect x="5" y="6" width="7" height="6" rx="1.5" fill="#fef08a" />
    <line x1="5" y1="17" x2="28" y2="17" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- Sparkle top-right -->
  <path d="M 52 8 Q 52 14 58 14 Q 52 14 52 20 Q 52 14 46 14 Q 52 14 52 8 Z" fill="#fbbf24" />
</svg>
