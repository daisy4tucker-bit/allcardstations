<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="favCardEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="favCardGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="favCardIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="favChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#favBg)" stroke="url(#favBorder)" stroke-width="2" />

  <!-- Back Card: Emerald -->
  <g transform="translate(10, 14) rotate(-12, 18, 12)">
    <rect x="0" y="0" width="34" height="22" rx="3.5" fill="url(#favCardEmerald)" stroke="#ffffff" stroke-width="0.8" opacity="0.8" />
  </g>

  <!-- Middle Card: Gold -->
  <g transform="translate(18, 12) rotate(10, 18, 12)">
    <rect x="0" y="0" width="36" height="23" rx="3.5" fill="url(#favCardGold)" stroke="#ffffff" stroke-width="0.8" opacity="0.9" />
  </g>

  <!-- Front Hero Card: Indigo with Chip and Lock -->
  <g transform="translate(13, 22)">
    <rect x="0" y="0" width="38" height="25" rx="4" fill="url(#favCardIndigo)" stroke="#ffffff" stroke-width="1" />
    <rect x="4" y="11" width="8" height="6" rx="1.5" fill="url(#favChip)" />
    <!-- Lock Circle -->
    <circle cx="28" cy="14" r="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
    <rect x="26" y="13" width="4" height="3" rx="0.5" fill="#38bdf8" />
  </g>

  <!-- Sparkle Top Right -->
  <path d="M 48 8 Q 48 14 54 14 Q 48 14 48 20 Q 48 14 42 14 Q 48 14 48 8 Z" fill="#fbbf24" />
</svg>
